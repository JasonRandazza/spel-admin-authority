[workspace]
members = [
    "admin-authority",
    "admin-authority-sample",
    "integration-tests",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JasonRandazza/spel-admin-authority"

[workspace.dependencies]
admin-authority = { path = "admin-authority" }
admin-authority-sample = { path = "admin-authority-sample" }
borsh = { version = "1", features = ["derive"] }
nssa = { path = "../logos-execution-zone/nssa", features = ["test-utils"] }
nssa_core = { path = "../logos-execution-zone/nssa/core", features = ["host"] }
risc0-zkvm = { version = "3.0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spel-framework = { path = "../spel/spel-framework" }
thiserror = "1"

[patch."https://github.com/logos-blockchain/logos-execution-zone.git"]
nssa_core = { path = "../logos-execution-zone/nssa/core" }
